name = "online-cv"
main = "_worker.js"
compatibility_date = "2024-01-01"

# Account details (replace with your Cloudflare account ID)
# account_id = "your-account-id-here"

[site]
bucket = "_site"

# Route configuration
[[routes]]
pattern = "cv.fabianpetri.com/*"
zone_name = "fabianpetri.com"

[[routes]]
pattern = "cv.fabianpetri.de/*"
zone_name = "fabianpetri.de"
