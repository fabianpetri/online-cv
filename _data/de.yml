career-profile:
  title: Karriere Profil
  summary: |
      Ich verfüge über mehr als 10 Jahre Erfahrung in der Softwareentwicklung und Automatisierungstechnik im Anlagen- und Maschinenbau, insbesondere in den Bereichen Automotive- und Verpackungsanlagen. 
      <br><br>
      Bei Loeschpack habe ich als "Lead Developer for HMI" die Neuentwicklung der Mensch-Maschine-Schnittstellen (HMI) geleitet, was die Evaluierung und Entwicklung von Hardware- und Softwarearchitekturen sowie die Implementierung eines CI/CD-Prozesses umfasste. 
      <br><br>
      Zusätzlich habe ich die Weiterentwicklung des System- und Anlagemarktes bei Loeschpack als "Lead Software Engineer for Machines and System Technology" vorangetrieben und war für die strategische Ausrichtung im Einklang mit den Unternehmenszielen verantwortlich.
      <br><br>
      Derzeit arbeite ich als Softwareentwickler bei ROTZINGER PharmaPack, wo ich an der Entwicklung eines neuen HMIs für verschiedene Maschinentypen arbeite. In meiner Freizeit widme ich mich der Hausautomatisierung und engagiere mich in Open-Source-Projekten.
