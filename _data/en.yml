career-profile:
  title: Career Profile
  summary: |
    I have more than 10 years of experience in software development and automation technology in plant and machine engineering, particularly in the areas of automotive and packaging systems.
    <br><br>
    Over the past 3 years, I led the redevelopment of Human-Machine Interfaces (HMI) at Loeschpack as "Lead Developer for HMI", which included the evaluation and development of hardware and software architectures as well as the implementation of a CI/CD process.
    <br><br>
    Additionally, I drove the advancement of the system and plant market at Loeschpack as "Lead Software Engineer for Machines and System Technology" and was responsible for strategic alignment in accordance with corporate goals.
    <br><br>
    Currently, I work as a software developer at Rotzinger PharmaPack, where I am developing a new HMI for various machine types. In my free time, I dedicate myself to home automation and engage in open-source projects.
